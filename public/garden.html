<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>实时词云 · WordGarden</title><link rel="icon" type="image/svg+xml" href="/icon.svg"><link rel="stylesheet" href="/css/style.css"><script src="/js/stable-cloud.js" defer></script><script src="/lib/qrcode.min.js" defer></script><script src="/js/i18n.js" defer></script><script src="/js/app.js" defer></script></head><body data-page="garden"><header><a class="brand" href="/"><img src="/icon.svg" width="28" height="28" alt=""><span>WordGarden</span></a><div class="header-actions"><button id="toggle-join" type="button" class="secondary" aria-expanded="true" aria-controls="join-panel">收起二维码</button><button id="fullscreen" class="secondary">⛶ 全屏展示</button><button id="language-toggle" type="button" class="secondary language-toggle" aria-label="切换为英文">EN</button></div></header><main class="garden"><div class="eyebrow">LIVE SESSION / 实时讨论</div><h1 id="question-title">正在加载问题…</h1><div class="session-status" role="status"><span id="session-state">正在收集回答</span><span id="session-countdown">每个问题开放 3 小时</span></div><div class="garden-layout" id="garden-layout"><aside class="card join" id="join-panel"><span class="eyebrow">加入这场讨论</span><div id="qrcode" aria-label="回答页二维码"></div><h2>扫码参与</h2><p class="muted">用一个词或短语，说说你的想法</p><a id="answer-link">打开回答页 ↗</a><button id="copy" class="secondary">复制参与链接</button><p id="message" role="status"></p></aside><section class="cloud-panel" aria-label="实时词云"><canvas id="cloud" aria-label="词云展示"></canvas><div id="empty"><span class="seed">✳</span><h2 id="empty-title">等待第一个回答</h2><p id="empty-description">扫码或打开参与链接，提交你的想法。</p></div><span id="connection" class="connection" role="status">连接中…</span></section></div><div class="stats"><span><strong id="participants">0</strong> 个参与标识</span><span><strong id="total">0</strong> 条回答</span><span><strong id="unique">0</strong> 个关键词</span><small>提到该关键词的回答越多，词语就越大</small></div><div class="export-actions"><button id="export-image" class="secondary" type="button" disabled>下载词云 PNG</button><button id="export-responses" class="secondary" type="button">导出回答 CSV</button><p id="export-message" role="status"></p></div><details><summary>查看原始回答</summary><div class="response-table-wrap"><table class="response-table"><thead><tr><th scope="col">用户 IP</th><th scope="col">原始发言</th></tr></thead><tbody id="word-list"></tbody></table></div></details></main><footer><div>Copyright &copy; 2026 <a href="https://github.com/iqiang111/WordGarden" target="_blank" rel="noopener noreferrer">iqiang111/WordGarden</a></div><span>让每一种声音被看见。</span></footer></body></html>
